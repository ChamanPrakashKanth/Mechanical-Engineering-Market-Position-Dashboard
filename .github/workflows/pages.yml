name: Deploy crawlable MechIntel site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node for engineering tools
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fieldnotes-app/package-lock.json

      - name: Build and verify free engineering tools
        env:
          BASE_PATH: /Mechanical-Engineering-Market-Position-Dashboard/fieldnotes/
          SITE_URL: https://chamanprakashkanth.github.io/Mechanical-Engineering-Market-Position-Dashboard/fieldnotes/
        run: |
          npm ci --prefix fieldnotes-app
          npm run build --prefix fieldnotes-app
          npm test --prefix fieldnotes-app

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check shared/mechintel-core.js
          node --check analytics.js
          node --test tests/analytics.test.cjs

      - name: Verify local MCP server and agent skill
        run: |
          npm ci --prefix mcp
          npm ci --prefix mcp/worker
          npm run sync-catalog --prefix mcp
          npm test --prefix mcp

      - name: Prepare static site
        run: |
          mkdir -p _site/assets _site/manim_courses/renders _site/engineering-careers _site/shared
          cp index.html defense-engineering-resources.html defense-engineering-feed.xml llms.txt app.js styles.css refinement.css robots.txt sitemap.xml .nojekyll _site/
          cp analytics.js analytics.css _site/
          cp shared/mechintel-core.js _site/shared/
          cp engineering_reference_profiles.json _site/
          cp engineering-careers/*.html _site/engineering-careers/
          cp engineering-careers/app.js _site/engineering-careers/
          cp assets/mechintel-social-cover.png _site/assets/
          cp -r assets/cad _site/assets/
          cp -r assets/gate-books _site/assets/
          cp manim_courses/renders/*.mp4 _site/manim_courses/renders/
          cp -r answerlens _site/answerlens

      - name: Integrate engineering fieldnotes and sitemap
        run: node fieldnotes-app/scripts/integrate.mjs

      - name: Refresh robotics intelligence from credited public RSS feeds
        run: python3 scripts/update_robotics_intelligence.py --output _site/robotics-intelligence.html --sitemap _site/sitemap.xml

      - name: Configure optional consent-first GA4
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GA4_ENHANCED_MEASUREMENT_DISABLED: ${{ vars.GA4_ENHANCED_MEASUREMENT_DISABLED }}
          GA4_DEBUG: ${{ vars.GA4_DEBUG }}
        run: node scripts/configure-analytics.cjs _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
